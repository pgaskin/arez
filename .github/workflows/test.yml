  wasm:
    name: Test (wasm on ${{ matrix.arch }}${{ matrix.goexperiment && ', simd' || '' }})
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        goexperiment: ['', simd]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      GOEXPERIMENT: ${{ matrix.goexperiment }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: go test -short -exec "env -i PATH=$PATH $(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./...
        env:
          GOOS: js
          GOARCH: wasm

  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: GONOPROXY=github.com/pgaskin/arez go run golang.org/x/exp/cmd/gorelease@v0.0.0-20261014143641-f0251eb4aa3e -base=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo none)
