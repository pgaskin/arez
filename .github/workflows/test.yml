name: Test

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.arch }}${{ matrix.goexperiment && ', simd' || '' }})
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        goexperiment: ['', simd]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      GOEXPERIMENT: ${{ matrix.goexperiment }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: lscpu # since it affects which amd64 simd implementation is used
      - run: go mod download
      - run: go mod verify
      - run: gofmt -d .
      - run: go vet ./...
      - run: go generate ./... && git diff --exit-code # ensure generated code is up-to-date
      - run: go test -v -cover -coverprofile=cover.out ./...
      - run: go tool cover -func=cover.out && rm cover.out
      - run: REZ_SIMD=avx512 go test -count=1 ./... # no VBMI
        if: ${{ matrix.arch == 'amd64' && matrix.goexperiment == 'simd' }}
      - run: REZ_SIMD=avx2 go test -count=1 ./... # no AVX-512
        if: ${{ matrix.arch == 'amd64' && matrix.goexperiment == 'simd' }}
      - run: REZ_SIMD=none go test -count=1 ./... # fallback scalers
        if: ${{ matrix.arch == 'amd64' && matrix.goexperiment == 'simd' }}
      - run: go test -count=1 -arez.guard=back ./...
      - run: go test -count=1 -arez.guard=front ./...

